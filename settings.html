<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Smart Road AI System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-body">

        <div class="card" style="max-width:640px;">
          <div class="card-header">
            <span class="card-title">System & AI Configuration</span>
          </div>

          <form id="settings-form" onsubmit="event.preventDefault(); showToast('Settings saved successfully', 'success');">
            <div class="form-group">
              <label>Configured YOLO Model Path</label>
              <input type="text" id="cfg-model" class="form-control" value="best.pt" readonly>
            </div>

            <div class="form-group">
              <label>Detection Confidence Threshold</label>
              <input type="number" step="0.05" id="cfg-conf" class="form-control" value="0.30">
            </div>

            <div class="form-group">
              <label>Municipality Reporting Email</label>
              <input type="email" id="cfg-email" class="form-control" value="road-maintenance@cityportal.gov">
            </div>

            <button type="submit" class="btn btn-primary">Save Settings 💾</button>
          </form>
        </div>

      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => requireAuth());
  </script>
</body>
</html>
