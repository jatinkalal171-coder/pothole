<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI-Powered Smart Road Monitoring System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.15), transparent 40%),
                  var(--bg-primary);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-brand .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .auth-brand h2 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-brand p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition-fast);
    }
    .form-control:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }
    .btn-block {
      width: 100%;
      justify-content: center;
      padding: 0.85rem;
      margin-top: 1rem;
    }
    .demo-users {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
    }
    .demo-users p {
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .demo-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .demo-chip {
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
    }
    .demo-chip:hover {
      border-color: var(--accent-blue);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="icon">🛣️</div>
      <h2>Smart Road Monitoring</h2>
      <p>Municipal AI Pothole Inspection Portal</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="officer@city.gov" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Sign In to Portal 🚀
      </button>
    </form>

    <div class="demo-users">
      <p>Quick Demo Sign-In Credentials:</p>
      <div class="demo-btn-group">
        <button type="button" class="demo-chip" onclick="quickFill('admin@city.gov', 'admin123')">👑 Admin</button>
        <button type="button" class="demo-chip" onclick="quickFill('officer@city.gov', 'officer123')">🏛️ Officer</button>
        <button type="button" class="demo-chip" onclick="quickFill('field07@city.gov', 'field123')">🛠️ Field Officer</button>
        <button type="button" class="demo-chip" onclick="quickFill('citizen@gmail.com', 'citizen123')">👤 Citizen</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function quickFill(email, pwd) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pwd;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        if (res && res.token) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          showToast(`Welcome back, ${res.user.name}!`, 'success');
          setTimeout(() => window.location.href = 'index.html', 500);
        }
      } catch (err) {
        // Handled in apiFetch
      }
    });
  </script>
</body>
</html>
